name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q --cov=invforecast --cov-report=term-missing
      - name: CLI smoke on the bundled sample
        run: |
          invforecast backtest data/sample_sales.csv --horizon 14 --splits 2 --models naive,seasonal_naive --markdown
          invforecast train data/sample_sales.csv --model seasonal_naive --out /tmp/model.joblib
          invforecast forecast /tmp/model.joblib --horizon 7
