[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-forecasting"
version = "0.1.0"
description = "Demand forecasting toolkit for small retailers: POS data cleaning, calendar/lag features with Bangladesh holidays, baseline and gradient-boosting models, rolling-origin backtests, and reorder-point / safety-stock recommendations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "typer>=0.9",
    "rich>=13",
    "PyYAML>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
invforecast = "invforecast.cli:app"

[tool.setuptools.packages.find]
include = ["invforecast*"]

[tool.setuptools.package-data]
invforecast = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["invforecast"]
